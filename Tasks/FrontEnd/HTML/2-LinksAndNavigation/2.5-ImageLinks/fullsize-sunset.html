<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Size - Ocean Sunset</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .fullsize-container {
            max-width: 1000px;
            width: 100%;
        }
        .fullsize-image {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .image-info {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            font-size: 1.1em;
            line-height: 1.6;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .back-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="fullsize-container">
        <svg class="fullsize-image" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
                    <stop offset="30%" style="stop-color:#feca57;stop-opacity:1" />
                    <stop offset="70%" style="stop-color:#ee5a6f;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#48dbfb;stop-opacity:1" />
                </linearGradient>
            </defs>
            <rect width="1200" height="800" fill="url(#sunsetGrad)"/>
            <circle cx="600" cy="400" r="150" fill="#ff6348" opacity="0.9"/>
            <ellipse cx="600" cy="400" rx="180" ry="40" fill="#ff6348" opacity="0.3"/>
            <rect y="650" width="1200" height="150" fill="#0984e3" opacity="0.8"/>
            <path d="M 0 680 Q 300 660 600 690 T 1200 680" stroke="white" stroke-width="3" fill="none" opacity="0.5"/>
            <text x="600" y="750" font-family="Arial" font-size="48" font-weight="bold" fill="white" text-anchor="middle">OCEAN SUNSET</text>
        </svg>
        
        <div class="image-info">
            <h1>🌅 Ocean Sunset</h1>
            <p>A breathtaking ocean sunset with vibrant orange and pink hues reflecting off the calm waters. Perfect for meditation and relaxation.</p>
            <a href="index.html" class="back-link">← Back to Gallery</a>
        </div>
    </div>
</body>
</html>
