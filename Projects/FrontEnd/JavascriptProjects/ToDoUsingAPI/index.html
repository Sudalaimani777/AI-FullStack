<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Handle Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8">
    <section class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8 mb-6">
        <h1 class="text-3xl font-bold text-center text-indigo-600 mb-6">Todo App Using API</h1>
        <form action="" id="form" class="flex gap-3">
            <input type="text" name="userName" id="userTask" placeholder="Enter Your Task"
                class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
            <input type="submit" value="Submit"
                class="px-6 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 cursor-pointer transition duration-200">
        </form>
    </section>
    <section id="userTasks" class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8 space-y-3">

    </section>
    <script type="module" src="./script.js"></script>
</body>

</html>
