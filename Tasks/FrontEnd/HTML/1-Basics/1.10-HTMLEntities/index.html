<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities</title>
</head>
<body>
    <!-- Some characters are reserved in HTML. -->
     <!-- If you use the less than (<) or greater than (>) signs in your HTML text, the browser might mix them with tags -->
    <!-- To display a less than sign (<) we must write: &lt; or &#60; -->
     &lt; This is the less than sign &gt;
    <br>
    <!-- NBSP (Non-Breaking Space) -->
    This&nbsp;is&nbsp;an&nbsp;example&nbsp;of&nbsp;non-breaking&nbsp;spaces.
    <br>
    <p>The NBSP is used to add extra spaces between words without breaking the line.</p>
</body>
</html>
