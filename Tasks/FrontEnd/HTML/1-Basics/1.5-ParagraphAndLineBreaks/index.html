<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraphs and Line Breaks</title>
</head>
<body>
    <section>
        <p>This is a paragraph. Paragraphs are used to group sentences together and create blocks of text.</p>
        <p>This is another paragraph. You can use multiple paragraphs to organize your content.</p>
        <p>Line breaks can be added using the <br> tag.<br>Here is a line break.</p>
        <hr>
        <p>This is a paragraph after a horizontal rule.</p>
    </section>
</body>
</html>
