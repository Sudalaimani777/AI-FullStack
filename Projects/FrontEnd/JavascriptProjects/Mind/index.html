<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MindVault</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen flex justify-center">

  <div id="loader" class="hidden flex justify-center items-center my-4 min-h-screen">
    <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <div class="w-full max-w-xl p-6">
    <h1 class="text-3xl font-bold mb-4 text-center">🧠 MindVault</h1>

    <form id="thoughtForm" class="flex gap-2 mb-4">
      <input
        id="thoughtInput"
        class="flex-1 p-2 rounded bg-slate-800"
        placeholder="Capture a thought..."
      />
      <select id="typeSelect" class="bg-slate-800 p-2 rounded">
        <option value="idea">💡 Idea</option>
        <option value="learning">📘 Learning</option>
        <option value="bug">🐞 Bug</option>
      </select>
      <button class="bg-indigo-600 px-4 rounded">Save</button>
    </form>

    <div id="thoughtList" class="space-y-2"></div>
  </div>

  <script type="module" src="./thought.js"></script>
  
</body>
</html>
