<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8">
    <section class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold text-gray-800 mb-2">CRUD Application</h1>
            <p class="text-gray-600 text-sm sm:text-base">Create, Read, Update, and Delete Tasks</p>
        </div>

        <!-- Form Container -->
        <div class="bg-white rounded-lg shadow-lg p-6 sm:p-8 mb-8">
            <form action="" class="flex flex-col sm:flex-row gap-3 sm:gap-4">
                <input type="text" name="" id="inputField" placeholder="Enter Task"
                    class="flex-1 px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition duration-200 text-gray-700 placeholder-gray-400">
                <input type="submit" value="Add Task"
                    class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transform hover:scale-105 transition duration-200 cursor-pointer focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
            </form>
        </div>

        <!-- Task Container -->
        <section id="taskContainer" class="bg-white rounded-lg shadow-lg p-6 sm:p-8">
            
        </section>
    </section>
    <script type="module" src="./script.js"></script>
</body>

</html>
