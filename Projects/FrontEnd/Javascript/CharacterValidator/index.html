<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-md">
        <!-- Card Container -->
        <div
            class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 lg:p-10 transform transition-all duration-300 hover:shadow-3xl">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold text-gray-800 mb-2">Character Validator</h1>
                <p class="text-sm sm:text-base text-gray-600">Enter at least 6 characters to proceed</p>
            </div>

            <!-- Form -->
            <form action="" id="form" class="space-y-6">
                <div class="space-y-4">
                    <!-- Input Field -->
                    <div class="relative">
                        <label for="inputField" class="block text-sm font-medium text-gray-700 mb-2">
                            Your Input
                        </label>
                        <input type="text" id="inputField" placeholder="Type something..."
                            class="w-full px-4 py-3 sm:py-4 border-2 border-gray-300 rounded-lg focus:ring-4 focus:ring-indigo-200 focus:border-indigo-500 outline-none transition-all duration-300 text-sm sm:text-base placeholder-gray-400">
                    </div>

                    <!-- Validation Message -->
                    <div class="min-h-[28px] flex items-center">
                        <p id="para" class="text-sm sm:text-base font-medium transition-all duration-300"></p>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="btn"
                        class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 disabled:from-gray-400 disabled:to-gray-500 disabled:cursor-not-allowed text-white font-semibold py-3 sm:py-4 px-6 rounded-lg shadow-lg hover:shadow-xl transform transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] text-sm sm:text-base">
                        Click To Validate
                    </button>
                </div>
            </form>

            <!-- Footer Info -->
            <div class="mt-8 pt-6 border-t border-gray-200">
                <div class="flex items-center justify-center space-x-2 text-xs sm:text-sm text-gray-500">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                            clip-rule="evenodd" />
                    </svg>
                    <span>Minimum 6 characters required</span>
                </div>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
