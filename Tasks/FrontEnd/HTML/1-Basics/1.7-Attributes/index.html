<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attributes in HTML</title>
</head>
<body>
    <!-- Attributes in HTML are used to provide additional information about an element. -->
    <!-- The most common attributes are id and class. -->
    <!-- Id Attribute is used to specify a unique id for an element. -->
    <h1 id="heading-one" class="header-class">Welcome to HTML Attributes</h1>
    <h2 id="heading-two">Heading Two</h2>
    <h3 id="heading-three">Heading Three</h3>

    <!-- Class Attribute is used to specify one or more class names for an element. -->
     <p class="para">Lorem, ipsum.</p>
     <p class="para">Lorem, ipsum.</p>
     <p class="para" style="color: red;">Lorem, ipsum.</p>

     <!-- Title Attribute is used to provide additional information about an element. -->
      <p title="This is an informative text">Hover me to see the informative text</p>

      <a href="#" title="Click the link">Click Here</a>
      <img src="#" alt="sample image" title="This is an image">
</body>
</html>
