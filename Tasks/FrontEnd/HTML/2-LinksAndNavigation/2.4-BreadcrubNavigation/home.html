<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Breadcrumb Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        nav[aria-label="breadcrumb"] {
            background-color: #f8f9fa;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .breadcrumb {
            list-style: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
        }
        .breadcrumb li.active {
            color: #6c757d;
            font-weight: 600;
        }
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin: 30px 0;
        }
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .link-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 10px;
            transition: transform 0.3s;
        }
        .link-card:hover {
            transform: translateY(-5px);
        }
        .link-card a {
            color: white;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="active" aria-current="page">🏠 Home</li>
            </ol>
        </nav>

        <h1>🏠 Home Page</h1>
        <p>Click below to navigate and see the breadcrumb trail build up:</p>

        <div class="link-grid">
            <div class="link-card">
                <a href="electronics.html">📱 Electronics</a>
            </div>
        </div>
    </div>
</body>
</html>
