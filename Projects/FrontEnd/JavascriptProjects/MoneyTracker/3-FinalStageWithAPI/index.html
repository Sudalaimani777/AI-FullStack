<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-slide-down {
            animation: slideDown 0.4s ease-out;
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        .hover-lift {
            transition: all 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 shadow-xl sticky top-0 z-50 animate-slide-down">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-1"></div>
                <div class="flex-shrink-0">
                    <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">
                        <i class="fa-solid fa-wallet mr-2"></i>Money Tracker
                    </h1>
                </div>
                <div class="flex-1 flex justify-end">
                    <button class="clear-btn bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-semibold transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl">
                        <i class="fa-solid fa-broom mr-2"></i>Clear All
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Form Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 mb-8 hover-lift animate-fade-in">
            <h2 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent mb-6">
                <i class="fa-solid fa-plus-circle text-indigo-600"></i> Add Transaction
            </h2>

            <form class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="relative">
                        <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">Task Name</label>
                        <input 
                            id="name" 
                            type="text" 
                            placeholder="Enter task name"
                            class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 transition-all duration-300 outline-none text-gray-700 font-medium"
                        >
                    </div>
                    <div class="relative">
                        <label for="money" class="block text-sm font-semibold text-gray-700 mb-2">Amount (₹)</label>
                        <input 
                            id="money" 
                            type="number" 
                            placeholder="Enter amount"
                            class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:ring-4 focus:ring-purple-100 transition-all duration-300 outline-none text-gray-700 font-medium"
                        >
                    </div>
                </div>

                <div class="flex flex-wrap gap-3">
                    <button type="button" class="add-btn bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 text-white px-6 py-3 rounded-xl font-semibold transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>Add Task</span>
                    </button>
                    <button type="button" class="update-btn bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white px-6 py-3 rounded-xl font-semibold transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span>Update</span>
                    </button>
                    <button type="button" class="delete-btn bg-gradient-to-r from-red-500 to-rose-500 hover:from-red-600 hover:to-rose-600 text-white px-6 py-3 rounded-xl font-semibold transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl flex items-center gap-2">
                        <i class="fa-solid fa-trash"></i>
                        <span>Delete</span>
                    </button>
                    <button type="button" class="back-btn bg-gradient-to-r from-gray-500 to-slate-500 hover:from-gray-600 hover:to-slate-600 text-white px-6 py-3 rounded-xl font-semibold transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Back</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Total Money Card -->
        <div class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 rounded-2xl shadow-2xl p-8 mb-8 text-center hover-lift animate-fade-in">
            <p class="text-white text-lg sm:text-xl font-semibold mb-2 opacity-90">Total Balance</p>
            <h3 class="text-4xl sm:text-5xl md:text-6xl font-bold text-white flex items-center justify-center gap-3">
                <i class="fa-solid fa-indian-rupee-sign"></i>
                <span class="total">0</span>
            </h3>
        </div>

        <!-- Transaction List -->
        <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 animate-fade-in">
            <h2 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent mb-6">
                <i class="fa-solid fa-list-check text-indigo-600"></i> Transactions
            </h2>
            <ul id="item-list" class="collection space-y-3">
                <!-- Items will be dynamically added here -->
            </ul>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
