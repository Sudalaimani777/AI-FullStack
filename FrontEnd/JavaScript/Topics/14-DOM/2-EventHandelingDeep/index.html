<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Handeling Deep</title>
</head>

<body>
    <div>
        <button id="btn">Check</button>
    </div>

    <form action="">
        <input type="text" name="text" id="text">
        <input type="password" name="password" id="password">
        <input type="submit" value="Click" id="submitBtn">
    </form>

    <!-- Without Propagation Concept -->
     <div class="parent">
        <h2>This is the parent div</h2>
        <div class="child">
            <h2>This is the child div</h2>
        </div>
     </div>

     <!-- With stopPropagation Concept -->
      <div class="wParent">
        <h2>With the use of stopPropagation</h2>
        <div class="wChild">
            <h2>This is the child div with the use of stopPropagation</h2>
        </div>
      </div>

    <!-- <script src="./eventObject.js"></script> -->
    <!-- <script src="./eventDelegation.js"></script> -->
    <!-- <script src="./formEvents.js"></script> -->
     <script src="./stopPropagation.js"></script>
</body>

</html>
