<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="calculator w-full max-w-sm sm:max-w-md">
        <input type="text" id="result" readonly class="w-full bg-gray-900 text-white text-right text-2xl sm:text-3xl lg:text-4xl font-bold p-4 sm:p-6 rounded-t-2xl border-none outline-none mb-1">
        <div class="buttons grid grid-cols-4 gap-2 sm:gap-3 bg-gray-800 p-4 sm:p-6 rounded-b-2xl">
            <button class="clear bg-red-600 hover:bg-red-700 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">C</button>
            <button class="delete bg-orange-600 hover:bg-orange-700 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">Del</button>
            <button class="parenthesis bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">(</button>
            <button class="parenthesis bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">)</button>
            <button class="number bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">7</button>
            <button class="number bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">8</button>
            <button class="number bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">9</button>
            <button class="operator bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">/</button>
            <button class="number bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">4</button>
            <button class="number bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">5</button>
            <button class="number bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">6</button>
            <button class="operator bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">*</button>
            <button class="number bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">1</button>
            <button class="number bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">2</button>
            <button class="number bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">3</button>
            <button class="operator bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">-</button>
            <button class="number col-span-2 bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">0</button>
            <button class="decimal bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">.</button>
            <button class="operator bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">+</button>
            <button class="equals col-span-4 bg-green-600 hover:bg-green-700 text-white font-bold py-4 sm:py-5 lg:py-6 px-4 rounded-xl text-lg sm:text-xl transition-all active:scale-95">=</button>
        </div>
    </div>
    <script src="./script.js    "></script>
</body>
</html>
