<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-gradient-to-br from-purple-500 via-pink-500 to-red-500 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">Color Picker</h1>

        <div class="space-y-6">
            <!-- Color Display Box -->
            <div id="colorDisplay"
                class="w-full h-48 rounded-lg border-4 border-gray-300 shadow-inner transition-all duration-300 flex items-center justify-center text-4xl font-bold text-white text-shadow"
                style="background-color: #3b82f6;">
                <span id="displayText" class="drop-shadow-lg">Click Generate!</span>
            </div>

            <!-- Number of Colors Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Number of Random Colors</label>
                <input type="number" id="numColors" value="1" min="1" max="10"
                    class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none">
            </div>

            <!-- Generate Button -->
            <button id="generateBtn"
                class="w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 shadow-md hover:shadow-lg">
                Generate Random Colors
            </button>

            <!-- Color Display Grid -->
            <div id="colorGrid" class="grid grid-cols-1 gap-4">
                <!-- Colors will be generated here -->
            </div>

            <!-- Copy All Button -->
            <button id="copyAllBtn"
                class="hidden w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 shadow-md hover:shadow-lg">
                Copy All Color Codes
            </button>

            <!-- Success Message -->
            <div id="successMsg" class="hidden text-center text-green-600 font-semibold">
                ✓ Color code copied to clipboard!
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
